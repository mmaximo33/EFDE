version: '3.9'

services:
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    restart: always
    container_name: ${EFDE_PROJECT_NAME}-phpmyadmin
    env_file: .env
    labels:
      - traefik.enable=true
      - traefik.http.routers.${EFDE_PROJECT_NAME}-phpmyadmin.rule=Host(`pma.${EFDE_PROJECT_DOMAIN}`)
      - traefik.http.services.${EFDE_PROJECT_NAME}-phpmyadmin.loadbalancer.server.port=80
    #    depends_on: ['database']
    networks:
      efde-network:

networks:
  efde-network:
    name: efde-traefik-network
    external: true

